name: Bootstrap lockfile

on:
  push:
    branches:
      - feat/cytoscape-adapter

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Update lockfile
        run: |
          bun install
          git diff -- bun.lock
